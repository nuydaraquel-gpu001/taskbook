<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Taskbook logo">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b86ea"/>
      <stop offset="1" stop-color="#1a5fc4"/>
    </linearGradient>
  </defs>
  <!-- blue tile -->
  <rect width="64" height="64" rx="15" fill="url(#tb-bg)"/>
  <!-- notebook page -->
  <rect x="15" y="11" width="35" height="42" rx="6" fill="#ffffff"/>
  <!-- notebook binding (light blue strip with rings) -->
  <rect x="15" y="11" width="9" height="42" rx="4" fill="#d7e8fc"/>
  <circle cx="19.5" cy="20" r="2" fill="#3b86ea"/>
  <circle cx="19.5" cy="32" r="2" fill="#3b86ea"/>
  <circle cx="19.5" cy="44" r="2" fill="#3b86ea"/>
  <!-- checkmark -->
  <path d="M28.5 32.5 L34 38 L44.5 25.5" fill="none" stroke="#1a5fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
